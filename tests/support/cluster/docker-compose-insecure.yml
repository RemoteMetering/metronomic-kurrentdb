version: "3.5"

services:
  metronomic-kurrentdb_promise_test_cluster_node1.kurrentdb: &template
    image: kurrentplatform/kurrentdb:25.0
    container_name: metronomic-kurrentdb_promise_test_cluster_node1.kurrentdb
    env_file:
      - vars.env
    environment:
      - KURRENTDB_INSECURE=true
      - KURRENTDB_REPLICATION_IP=172.30.240.11
      - KURRENTDB_ADVERTISE_NODE_PORT_TO_CLIENT_AS=22137
      - KURRENTDB_GOSSIP_SEED=172.30.240.12:2113,172.30.240.13:2113
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --insecure http://metronomic-kurrentdb_promise_test_cluster_node1.kurrentdb:2113/health/live || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
    ports:
      - "11136:1113"
      - "22137:2113"
    restart: always
    networks:
      clusternetwork:
        ipv4_address: 172.30.240.11

  metronomic-kurrentdb_promise_test_cluster_node2.kurrentdb:
    <<: *template
    container_name: metronomic-kurrentdb_promise_test_cluster_node2.kurrentdb
    environment:
      - KURRENTDB_INSECURE=true
      - KURRENTDB_REPLICATION_IP=172.30.240.12
      - KURRENTDB_ADVERTISE_NODE_PORT_TO_CLIENT_AS=22157
      - KURRENTDB_GOSSIP_SEED=172.30.240.11:2113,172.30.240.13:2113
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --insecure http://metronomic-kurrentdb_promise_test_cluster_node2.kurrentdb:2113/health/live || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
    ports:
      - "11156:1113"
      - "22157:2113"
    networks:
      clusternetwork:
        ipv4_address: 172.30.240.12

  metronomic-kurrentdb_promise_test_cluster_node3.kurrentdb:
    <<: *template
    container_name: metronomic-kurrentdb_promise_test_cluster_node3.kurrentdb
    environment:
      - KURRENTDB_INSECURE=true
      - KURRENTDB_REPLICATION_IP=172.30.240.13
      - KURRENTDB_ADVERTISE_NODE_PORT_TO_CLIENT_AS=22177
      - KURRENTDB_GOSSIP_SEED=172.30.240.11:2113,172.30.240.12:2113
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --insecure http://metronomic-kurrentdb_promise_test_cluster_node3.kurrentdb:2113/health/live || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
    ports:
      - "11176:1113"
      - "22177:2113"
    networks:
      clusternetwork:
        ipv4_address: 172.30.240.13

networks:
  clusternetwork:
    name: metronomic-kurrentdb_promise_test_cluster_kurrentdbdb.local
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.240.0/24